name: Backup de la base + prueba de restauración

# S10. Corre sola cada domingo y a pedido (Actions → Run workflow).
# Necesita dos secretos del repositorio (los carga el dueño, ver docs/BACKUPS.md):
#   BACKUP_DATABASE_URL  cadena de conexión de SOLO LECTURA a la base (pooler de sesión de Supabase)
#   BACKUP_PASSPHRASE    frase larga para cifrar el archivo
on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente de Postgres 16
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16

      - name: Volcar y cifrar
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$BACKUP_DATABASE_URL" && test -n "$BACKUP_PASSPHRASE"
          pg_dump --format=custom --no-owner --no-privileges --dbname="$BACKUP_DATABASE_URL" --file=cozizina.dump
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" --symmetric --cipher-algo AES256 --output cozizina.dump.gpg cozizina.dump
          rm cozizina.dump
          ls -l cozizina.dump.gpg

      - uses: actions/upload-artifact@v4
        with:
          name: cozizina-backup-${{ github.run_id }}
          path: cozizina.dump.gpg
          retention-days: 30
          if-no-files-found: error

  restaurar-prueba:
    # Un backup que no se restaura no es un backup: lo levanta en una base vacía y cuenta filas.
    needs: backup
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: restore
          POSTGRES_DB: restore
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cozizina-backup-${{ github.run_id }}
      - name: Restaurar y verificar
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          PGPASSWORD: restore
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" --decrypt --output cozizina.dump cozizina.dump.gpg
          pg_restore --no-owner --no-privileges -h localhost -U postgres -d restore cozizina.dump
          for t in tenants usuarios productos pedidos pagos; do
            n=$(psql -h localhost -U postgres -d restore -Atc "select count(*) from $t")
            echo "$t: $n filas"
          done
          # Si el negocio ya tiene pedidos, la copia restaurada tiene que tenerlos.
          test "$(psql -h localhost -U postgres -d restore -Atc 'select count(*) from tenants')" -ge 1
