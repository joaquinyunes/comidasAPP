services:
  postgres:
    image: postgres:16-alpine
    container_name: cozizina-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cozizina
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cozizina-app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/cozizina?schema=public
      - JWT_SECRET=cambiar-en-produccion-min-32-chars
      - NODE_ENV=development
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: >
      sh -c "npx prisma db push &&
             npm run db:seed &&
             npm run dev"

volumes:
  postgres_data:
